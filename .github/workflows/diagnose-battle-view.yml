name: Diagnose Battle View
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime bundle
        run: python3 scripts/build_runtime_bundle.py >/dev/null
      - name: Export resolved team shape
        run: |
          python3 - <<'PY'
          import json,sys,tarfile,tempfile
          from pathlib import Path
          root=Path.cwd()
          with tempfile.TemporaryDirectory() as td:
            with tarfile.open(root/'public/runtime_bundle_b223.tgz','r:gz') as bundle:bundle.extractall(td)
            engine=Path(td)/'02_ENGINE';sys.path.insert(0,str(engine))
            import browser_runtime_api as api
            team=api._make(api.TARGETS['YAMAMOTO'])
            def prune(value,depth=0):
              if depth>4:return type(value).__name__
              if isinstance(value,dict):return {str(k):prune(v,depth+1) for k,v in value.items()}
              if isinstance(value,list):return [prune(v,depth+1) for v in value[:8]]
              if isinstance(value,(str,int,float,bool)) or value is None:return value
              return str(value)
            (root/'battle-view-diagnostic.json').write_text(json.dumps(prune(team),ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: battle-view-diagnostic
          path: battle-view-diagnostic.json

name: Diagnose Battle Events
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_runtime_bundle.py >/dev/null
      - name: Export 100-battle trace structure and sources
        run: |
          python3 - <<'PY'
          import json,sys,tarfile,tempfile,shutil
          from pathlib import Path
          root=Path.cwd()
          with tempfile.TemporaryDirectory() as td:
            with tarfile.open(root/'public/runtime_bundle_b223.tgz','r:gz') as bundle: bundle.extractall(td)
            engine=Path(td)/'02_ENGINE';sys.path.insert(0,str(engine))
            import browser_runtime_api as api
            request={
              'candidate':api.TARGETS['YAMAMOTO'],
              'target':'KURODA',
              'target_spec':api.TARGETS['KURODA'],
              'trials':100,'blocks':1,'seed':1326230000,'include_detail':True,
            }
            result=json.loads(api.evaluate_request(request))
            (root/'battle-events-diagnostic.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
            shutil.copy2(engine/'battle_simulator.py',root/'battle-simulator-diagnostic.py')
            shutil.copy2(engine/'browser_runtime_api.py',root/'browser-runtime-api-diagnostic.py')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: battle-events-diagnostic
          path: |
            battle-events-diagnostic.json
            battle-simulator-diagnostic.py
            browser-runtime-api-diagnostic.py

name: BONSAI One-time Autofix

on:
  push:
    branches:
      - agent/bonsai-v0.8-deploy
    paths:
      - 'public/bonsai/index.html'
      - '.github/workflows/bonsai-autofix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bonsai-v0.8-deploy
      - name: Patch missing modal brace
        run: |
          python3 <<'PY'
          from pathlib import Path
          path=Path('public/bonsai/index.html')
          text=path.read_text()
          old="</button></div></div>`;return''}function render(){"
          new="</button></div></div>`;}return''}function render(){"
          if old not in text:
              raise SystemExit('target sequence not found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Commit corrected source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/bonsai/index.html
          git commit -m 'BONSAI結果モーダルの構文エラーを修正'
          git push origin HEAD:agent/bonsai-v0.8-deploy

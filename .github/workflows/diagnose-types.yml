name: Diagnose Types
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture build output
        shell: bash
        run: |
          set +e
          npm run build > type-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> type-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: type-diagnostics
          path: type-diagnostics.txt

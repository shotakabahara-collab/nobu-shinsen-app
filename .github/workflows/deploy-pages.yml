name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build:runtime
      - run: npm run test:runtime
      - run: npm test
      - run: npm run build
      - run: npm run test:offline
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed application and canonical runtime bundle
        id: smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}/"
          expected_bundle_sha="$(node -p "require('./canonical/LOCK.json').runtimeBundleSha256")"
          expected_archive_sha="$(node -p "require('./canonical/LOCK.json').archiveSha256")"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}" -o /tmp/nobu-index.html
          grep -Fq '<title>NOBU Companion</title>' /tmp/nobu-index.html
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}manifest.webmanifest" -o /tmp/nobu-manifest.json
          node -e "const m=require('/tmp/nobu-manifest.json');if(m.name!=='NOBU Companion'||m.display!=='standalone')process.exit(1)"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}runtime-worker.js" -o /tmp/runtime-worker.js
          grep -Fq 'browser_runtime_api' /tmp/runtime-worker.js
          grep -Fq 'build_battle_examples' /tmp/runtime-worker.js
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}battle-example-api.py" -o /tmp/battle-example-api.py
          grep -Fq 'def build_battle_examples' /tmp/battle-example-api.py
          grep -Fq "return {'win':1,'loss':0}" /tmp/battle-example-api.py
          grep -Fq "return {'win':1,'loss':1}" /tmp/battle-example-api.py
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}runtime_bundle_b223.tgz" -o /tmp/runtime_bundle_b223.tgz
          echo "${expected_bundle_sha}  /tmp/runtime_bundle_b223.tgz" | sha256sum --check --strict
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}canonical_officer_catalog.json" -o /tmp/canonical_officer_catalog.json
          node -e "const c=require('/tmp/canonical_officer_catalog.json');const m=new Map(c.officers.map(x=>[x.name,x]));const matsu=m.get('松永久秀');const kaki=m.get('柿崎景家');if(c.canonicalArchiveSha256!==process.argv[1]||c.officerCount!==c.officers.length||matsu?.inherentSkill!=='梟雄の計'||c.unitLevelRule?.baseLevel!==5||c.unitLevelRule?.defaultCap!==10||c.unitLevelRule?.capUnlockMode!=='unbounded'||!matsu?.unitLevelTraits?.some(t=>t.name==='砲術Ⅲ'&&t.unlockedAt===3&&t.levelBonus===3&&t.capUnlock===false)||!kaki?.unitLevelTraits?.some(t=>t.name==='騎兵大将'&&t.capUnlock===true))process.exit(1)" "${expected_archive_sha}"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}canonical_officer_stats_catalog.json" -o /tmp/canonical_officer_stats_catalog.json
          node -e "const c=require('/tmp/canonical_officer_stats_catalog.json');const m=new Map(c.records.map(x=>[x.name+'|'+x.awaken,x]));const y=m.get('山本勘助|2');const keys=c.records.map(x=>x.name+'|'+x.awaken);if(c.canonicalArchiveSha256!==process.argv[1]||c.recordCount!==c.records.length||new Set(keys).size!==keys.length||y?.allocated?.intel!==244||y?.allocated?.speed!==117||y?.actionOrderSpeed!==117)process.exit(1)" "${expected_archive_sha}"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}canonical_skill_catalog.json" -o /tmp/canonical_skill_catalog.json
          node -e "const c=require('/tmp/canonical_skill_catalog.json');const m=new Map(c.skills.map(x=>[x.name,x]));if(c.canonicalArchiveSha256!==process.argv[1]||c.skillCount!==c.skills.length||m.get('紅蓮の炎')?.attachable!==true||m.get('梟雄の計')?.attachable!==false||!c.skills.every(x=>Array.isArray(x.unitLevelEffects)))process.exit(1)" "${expected_archive_sha}"
      - name: Record release audit
        if: always()
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const lock = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'canonical/LOCK.json'), 'utf8'));
            const officerPath = path.join(process.env.GITHUB_WORKSPACE, 'public/canonical_officer_catalog.json');
            const officerStatsPath = path.join(process.env.GITHUB_WORKSPACE, 'public/canonical_officer_stats_catalog.json');
            const skillPath = path.join(process.env.GITHUB_WORKSPACE, 'public/canonical_skill_catalog.json');
            const officerCatalog = fs.existsSync(officerPath) ? JSON.parse(fs.readFileSync(officerPath, 'utf8')) : null;
            const officerStats = fs.existsSync(officerStatsPath) ? JSON.parse(fs.readFileSync(officerStatsPath, 'utf8')) : null;
            const skillCatalog = fs.existsSync(skillPath) ? JSON.parse(fs.readFileSync(skillPath, 'utf8')) : null;
            const passed = process.env.DEPLOY_OUTCOME === 'success' && process.env.SMOKE_OUTCOME === 'success';
            const status = passed ? 'PASS' : 'FAIL';
            const pageUrl = process.env.PAGE_URL || '未取得';
            const body = [
              `# Automated release audit: ${status}`,
              '',
              `- 記録日時: ${new Date().toISOString()}`,
              `- main SHA: \`${context.sha}\``,
              `- Pages URL: ${pageUrl}`,
              `- deployment: ${process.env.DEPLOY_OUTCOME || 'unknown'}`,
              `- post-deploy smoke: ${process.env.SMOKE_OUTCOME || 'unknown'}`,
              `- canonical version: \`${lock.canonicalVersion}\``,
              `- runtime bundle SHA-256: \`${lock.runtimeBundleSha256}\``,
              `- canonical officer catalog: ${officerCatalog ? `${officerCatalog.officerCount}武将 / 通常上限10・上限解放時は天井なし` : '未生成'}`,
              `- canonical officer stats: ${officerStats ? `${officerStats.recordCount}件 / 凸別・ステ振り後4能力・行動順用速度` : '未生成'}`,
              `- canonical skill catalog: ${skillCatalog ? `${skillCatalog.skillCount}戦法 / 装着可否・兵種Lv効果laneあり` : '未生成'}`,
              `- detailed battle example API: 合計100戦 / 勝ち1例・負け1例 / T1〜T8 / 行動内容 / 実兵数増減`,
              '',
              '## Smoke対象',
              '',
              '- 公開HTMLタイトル',
              '- PWA manifest / standalone設定',
              '- runtime-worker.js / canonical adapter参照 / detailed example bridge',
              '- battle-example-api.py / 勝敗例・T1〜T8・兵数増減抽出',
              '- runtime_bundle_b223.tgz / release lock SHA一致',
              '- canonical_officer_catalog.json / 固有・凸別兵種Lv特性・無天井の上限解放ルール一致',
              '- canonical_officer_stats_catalog.json / 凸別ステ振り後4能力・行動順用速度一致',
              '- canonical_skill_catalog.json / 固有装着不可・装着可能戦法・戦法由来兵種Lv効果lane一致',
              '',
              passed
                ? '機械検証範囲はリリースPASSです。物理iPhoneでは合計100戦の所要時間、勝ち・負け各1例、T1〜T8の行動内容、兵数増減を確認してください。'
                : '公開工程またはsmokeに失敗しています。GitHub ActionsのDeploy GitHub Pagesログを確認してください。',
            ].join('\n');
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              title: `Release ${status}: ${context.sha.slice(0, 7)}`,
              body,
              state: passed ? 'closed' : 'open',
            };
            if (passed) params.state_reason = 'completed';
            await github.rest.issues.update(params);

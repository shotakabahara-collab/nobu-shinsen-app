name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run test:runtime
      - run: npm test
      - run: npm run build
      - run: npm run test:offline
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed application and canonical runtime bundle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUNDLE_SHA256: 42910f235511f5b54ec84802f072836b40935b7349455d08e36b4d5815ff423b
        run: |
          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}" -o /tmp/nobu-index.html
          grep -Fq '<title>NOBU Companion</title>' /tmp/nobu-index.html
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}manifest.webmanifest" -o /tmp/nobu-manifest.json
          node -e "const m=require('/tmp/nobu-manifest.json');if(m.name!=='NOBU Companion'||m.display!=='standalone')process.exit(1)"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}runtime-worker.js" -o /tmp/runtime-worker.js
          grep -Fq 'browser_runtime_api' /tmp/runtime-worker.js
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${base}runtime_bundle_b223.tgz" -o /tmp/runtime_bundle_b223.tgz
          echo "${EXPECTED_BUNDLE_SHA256}  /tmp/runtime_bundle_b223.tgz" | sha256sum --check --strict

<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09100c"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BONSAI">
<meta name="description" content="育てた時間が、作品になる。盆栽育成シミュレーション BONSAI">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>BONSAI</title>
<style>html,body{margin:0;min-height:100%;background:#09100c;color:#f0eadc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.boot{min-height:100dvh;display:grid;place-items:center;text-align:center}.mark{font:26px Georgia,serif;letter-spacing:.25em}.sub{margin-top:12px;color:#a5ada5;font-size:12px}.bar{width:180px;height:4px;margin:22px auto;background:#1a271e;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#d9b77b;animation:m 1.1s infinite ease-in-out}@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}</style></head>
<body><div class="boot"><div><div class="mark">BONSAI</div><div class="sub">作品を整えています</div><div class="bar"><i></i></div></div></div>
<script>
(async()=>{try{const names=Array.from({length:26},(_,i)=>`./payload/part-${String(i).padStart(2,'0')}.txt`);const rows=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const html=rows.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><div class="mark">BONSAI</div><p class="sub">読み込みに失敗しました。通信を確認して再読み込みしてください。</p><button onclick="location.reload()" style="padding:12px 20px;border:0;border-radius:12px">再読み込み</button></div></div>'}})();
</script></body></html>

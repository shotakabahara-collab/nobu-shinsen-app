<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#09100c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BONSAI"><meta name="description" content="育てた時間が、作品になる。盆栽育成シミュレーションBONSAI"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>BONSAI</title><style>
:root{--bg:#09100c;--card:#16221a;--card2:#1d2c21;--text:#f2ebdc;--muted:#9eaaa1;--gold:#d9b77b;--green:#789c7e;--red:#d77e72;--line:#ffffff17;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);color-scheme:dark}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#2c4434 0,#101a13 38%,#09100c 78%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:calc(82px + var(--safe))}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(#09100cf7,#09100cb8,transparent);backdrop-filter:blur(15px)}.logo{font:20px Georgia,serif;letter-spacing:.23em}.mini{font-size:9px;color:var(--gold);letter-spacing:.12em}.money{font-size:10px;padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:#ffffff0b}.wrap{padding:4px 12px}.card{background:linear-gradient(145deg,#1b2a20f7,#101912fa);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 44px #0004;overflow:hidden}.herohead{display:flex;justify-content:space-between;padding:16px 16px 4px}.herohead h1{font:28px Georgia,"Yu Mincho",serif;margin:3px 0}.muted{color:var(--muted);font-size:10px;line-height:1.65}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;border:1px solid #d9b77b44;background:#d9b77b14;color:#ecd09e;font-size:9px}.stage{height:330px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 32%,#92aa951f,transparent 45%),linear-gradient(#ffffff03,#0003);overflow:hidden}.tree{width:100%;height:100%;filter:drop-shadow(0 20px 14px #0007)}.season{position:absolute;right:14px;top:14px;width:42px;height:42px;border:1px solid #ffffff2b;border-radius:50%;display:grid;place-items:center;background:#0004;font-family:"Yu Mincho",serif}.stats{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px;text-align:center;border:1px solid var(--line);border-radius:12px;background:#08100bbb;backdrop-filter:blur(7px)}.stat small{display:block;color:var(--muted);font-size:8px}.stat b{font-size:13px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:11px}.act{min-height:64px;border:1px solid var(--line);border-radius:15px;background:#ffffff0b;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.act span{font-size:21px}.act small{font-size:9px;color:var(--muted)}.act:active{transform:scale(.97)}.section{margin:22px 3px 9px;font:20px Georgia,"Yu Mincho",serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.info,.item{padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1b2a20,#111b15)}.info h3,.item h3{margin:0 0 6px;font-size:12px}.big{font:26px Georgia,serif;color:var(--gold)}.bar{height:6px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}.brief{margin:10px 0;padding:12px;border:1px solid #d9b77b33;border-radius:17px;background:#d9b77b0d}.brief b{font:13px Georgia,"Yu Mincho",serif}.brief p{margin:5px 0 0;color:var(--muted);font-size:9px;line-height:1.6}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;padding:6px 8px calc(6px + var(--safe));background:#071009ed;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{min-height:52px;border:0;background:transparent;color:var(--muted);font-size:8px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}.nav button span{font-size:18px}.nav button.on{color:var(--text)}.page h1{font:29px Georgia,"Yu Mincho",serif;margin:10px 2px 2px}.page>p{margin:0 2px 12px;color:var(--muted);font-size:10px}.list{display:grid;gap:9px}.person{display:grid;grid-template-columns:60px 1fr;gap:11px;align-items:center}.face{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 35% 28%,#f1c2a0,#7c5948 58%,#30241e);border:2px solid #ffffff22;box-shadow:0 10px 20px #0005}.person h3{margin:0;font:15px Georgia,"Yu Mincho",serif}.person p{margin:4px 0;color:var(--muted);font-size:9px;line-height:1.5}.quote{margin-top:8px;padding:10px;border-left:2px solid var(--gold);background:#d9b77b0b;color:#e6dac3;font:12px Georgia,"Yu Mincho",serif;line-height:1.7}.rankrow{display:grid;grid-template-columns:28px 1fr 42px;gap:7px;align-items:center}.rankrow b{color:var(--gold);text-align:center}.rankrow strong{font-size:11px}.rankrow small{display:block;color:var(--muted);font-size:8px}.rankrow em{font-style:normal;text-align:right;font:17px Georgia,serif}.you{border-color:var(--gold);background:#d9b77b14}.primary,.secondary{width:100%;min-height:45px;border:0;border-radius:14px;margin-top:8px;font-weight:700}.primary{background:var(--text);color:#101711}.secondary{background:#ffffff0b;color:var(--text);border:1px solid var(--line)}.danger{background:linear-gradient(135deg,#a6493d,#6d2823);color:white}.potgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pot{text-align:center}.potshape{width:90px;height:34px;margin:11px auto;border-radius:5px 5px 22px 22px;background:var(--pot);box-shadow:inset 0 4px 7px #fff2,0 10px 16px #0005}.pot.active{border-color:var(--gold)}.award{display:grid;grid-template-columns:48px 1fr;gap:10px}.medal{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#e6cb91,#8b6730);color:#24190b}.empty{text-align:center;padding:44px 15px;color:var(--muted);font-size:11px;line-height:1.8}.modal{position:fixed;z-index:70;inset:0;background:#000b;backdrop-filter:blur(8px);display:flex;align-items:flex-end}.sheet{width:100%;max-width:720px;max-height:90dvh;overflow:auto;margin:auto;background:#152019;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:15px 15px calc(22px + var(--safe))}.sheet h2{font:23px Georgia,"Yu Mincho",serif}.grab{width:42px;height:5px;border-radius:99px;background:#ffffff30;margin:0 auto 13px}.onboard{min-height:100dvh;max-width:720px;margin:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 15px calc(24px + var(--safe));display:flex;flex-direction:column;justify-content:center}.onboard h1{font:38px Georgia,serif;letter-spacing:.23em;margin:0}.tag{font:17px Georgia,"Yu Mincho",serif;color:#dfd4bf;margin:7px 0 20px}.choices{display:grid;gap:8px}.choice{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;text-align:left;padding:11px;border:1px solid var(--line);border-radius:17px;background:#17241b;color:var(--text)}.choice.on{border-color:var(--gold)}.choice span{font-size:34px}.choice b{display:block}.choice small{color:var(--muted);font-size:9px}.name{width:100%;padding:13px;margin-top:10px;border-radius:13px;border:1px solid var(--line);background:#ffffff0b;color:var(--text)}.toast{position:fixed;z-index:100;left:50%;bottom:calc(82px + var(--safe));transform:translateX(-50%);padding:10px 14px;border-radius:99px;background:var(--text);color:#111;font-size:10px;white-space:nowrap;animation:to 2.3s forwards}@keyframes to{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}.wall{position:fixed;z-index:90;inset:0;background:radial-gradient(circle at 50% 30%,#4d6253,#18231c 48%,#060a07);display:grid;place-items:center}.wall .tree{width:min(98vw,700px);height:min(88vh,850px)}.wall button{position:absolute;bottom:calc(18px + var(--safe));padding:10px 15px;border:1px solid var(--line);border-radius:99px;background:#0007;color:white}.timeline{border-left:2px solid #d9b77b66}.hidden{display:none!important}@media(min-width:620px){.stage{height:430px}.choices{grid-template-columns:repeat(3,1fr)}.choice{grid-template-columns:1fr;text-align:center}.potgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:370px){.grid,.potgrid{grid-template-columns:1fr}.money{display:none}}
</style></head><body><div id="root"></div><script>
(()=>{'use strict';const K='bonsai_live_v08';const DAY=8640000;const species={pine:{n:'黒松',e:'🌲',t:'剛の盆栽',leaf:'#355f40',se:[86,78,82,92],dry:1.7},maple:{n:'山もみじ',e:'🍁',t:'季節の盆栽',leaf:'#6d9c65',se:[94,72,100,84],dry:2.3},azalea:{n:'皐月',e:'🌸',t:'華の盆栽',leaf:'#58835b',se:[100,80,74,68],dry:2.1}};const pots=[['starter','素焼き入門鉢',0,72,'#8d6043'],['blue','青嵐釉楕円鉢',1800,88,'#477b7b'],['black','黒土長方鉢',3400,92,'#302b28'],['moon','月光白釉鉢',7200,95,'#b5b0a3'],['old','古渡・琥珀鉢',15000,98,'#895433']];const people={gensai:['榊 玄斎','古典盆栽・宗匠','👴','枝を切るな。迷いを切れ。'],shino:['水城 志乃','季節盆栽作家','👩','咲かせるだけではなく、どこで咲かせるか。'],ren:['橘 蓮','現代盆栽アーティスト','🧑','作品は守るものじゃない。更新するものだ。'],gakuto:['岩城 岳斗','松柏専門・若手筆頭','👨','派手さはいらん。幹を見ろ。'],judge:['三嶋 宗一郎','全国樹藝会 審査長','🧓','十年後にも立つ姿か。それを審査する。'],critic:['牧村 玲二','樹藝評論家','🧔','技術はある。だが、まだ景色がない。'],patron:['東雲 崇','蒼月コレクション主宰','🤵','値段ではない。手放せない理由を買いたい。']};const fresh=()=>({v:8,started:false,name:'あなた',mentor:'gensai',sp:'pine',tree:'',born:Date.now(),water:80,last:Date.now(),vit:84,stress:2,prune:0,wire:0,fert:0,pot:'starter',money:5000,rep:0,awards:[],timeline:[],stats:{water:0,prune:0,wire:0,shows:0},tutorial:0,lastWeek:null,title:'若木の友'});let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(K)||'null')}}catch{s=fresh()}let tab='home',modal='',toast='',wall=false;const save=()=>localStorage.setItem(K,JSON.stringify(s));const $=q=>document.querySelector(q);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const gameDays=()=>Math.max(0,(Date.now()-s.born)/DAY);const season=()=>Math.floor((gameDays()%360)/90);const seJa=['春','夏','秋','冬'];const derived=()=>{let h=(Date.now()-s.last)/36e5,w=Math.max(0,s.water-h*species[s.sp].dry),sdec=Math.min(s.stress,gameDays()*.02),stress=Math.max(0,s.stress-sdec),vit=Math.max(0,Math.min(100,s.vit-(Math.max(0,35-w)*.34)-stress*.13+s.fert*1.2)),age=gameDays(),m=Math.min(100,10+Math.log2(age+1)*10+s.prune*3+s.wire*2),branch=Math.min(100,12+Math.log2(age+1)*5+s.prune*6),p=pots.find(x=>x[0]===s.pot),harm=Math.min(100,p[3]+(s.sp==='pine'&&s.pot==='black'?5:0)+(s.sp==='maple'&&s.pot==='blue'?5:0)+(s.sp==='azalea'&&s.pot==='moon'?4:0));return{w,vit,stress,age,m,branch,harm,p}};const title=()=>{if(s.awards.some(a=>a.award==='天樹大賞'))return'天樹を戴く者';if(s.awards.some(a=>a.award==='金賞'))return'金枝の匠';if(s.stats.shows>=3)return'舞台を知る盆栽師';if(s.stats.prune>=5)return'枝の語り手';if(s.stats.water>=10)return'土を読む者';return'若木の友'};const note=(x)=>{toast=x;render();setTimeout(()=>{toast='';render()},2300)};const person=(id)=>`<div class="person item"><div class="face">${people[id][2]}</div><div><h3>${people[id][0]}</h3><p>${people[id][1]}</p><div class="quote">${people[id][3]}</div></div></div>`;function treeSvg(){const d=derived(),sp=species[s.sp],leaf=season()===2&&s.sp==='maple'?'#b65d37':sp.leaf,branches=5+Math.min(5,s.prune),leaves=Array.from({length:branches*4},(_,i)=>{let x=170+((i*47)%210)-105,y=70+((i*37)%155),r=14+(i%4)*3;return`<ellipse cx="${x}" cy="${y}" rx="${r*1.4}" ry="${r}" fill="${leaf}" opacity="${.7+(i%3)*.1}"/>`}).join(''),flowers=s.sp==='azalea'&&season()===0?Array.from({length:12},(_,i)=>`<circle cx="${100+(i*61)%230}" cy="${75+(i*43)%130}" r="7" fill="${i%2?'#efb0bb':'#fff0e9'}"/>`).join(''):'';return`<svg class="tree" viewBox="0 0 360 330" aria-label="${sp.n}"><defs><linearGradient id="tr" x1="0" x2="1"><stop stop-color="#4b3225"/><stop offset=".55" stop-color="#90664a"/><stop offset="1" stop-color="#322218"/></linearGradient></defs><path d="M183 275 C166 230 201 208 180 174 C157 139 203 116 195 76" fill="none" stroke="url(#tr)" stroke-width="24" stroke-linecap="round"/><path d="M181 213 Q116 173 76 187 M185 180 Q243 144 286 163 M183 148 Q127 110 93 126 M193 116 Q246 88 281 105" fill="none" stroke="#64432f" stroke-width="10" stroke-linecap="round"/>${leaves}${flowers}<ellipse cx="180" cy="279" rx="77" ry="16" fill="#263527"/><rect x="93" y="278" width="174" height="18" rx="6" fill="${d.p[4]}"/><path d="M103 293h154l-18 27H121z" fill="${d.p[4]}"/><rect x="121" y="316" width="22" height="5" fill="${d.p[4]}"/><rect x="217" y="316" width="22" height="5" fill="${d.p[4]}"/></svg>`}function mentorText(){let d=derived();if(s.tutorial===0)return'まず木の今日の姿を見よう。触る前に、見ることから始める。';if(d.w<35)return'土が乾いている。今は根元まで水を通す時だ。';if(d.vit<55)return'今日は切るな。樹勢を戻すのも技術だ。';if(d.harm<80)return'高い鉢より、この木に合う鉢を探しなさい。';return people[s.mentor][3]}function top(){return`<header class="top"><div><div class="mini">育てた時間が、作品になる。</div><div class="logo">BONSAI</div></div><div class="money">${s.title=title()}｜¥${s.money.toLocaleString()}</div></header>`}function home(){let d=derived();return`<main class="wrap"><div class="brief"><b>${people[s.mentor][2]} ${people[s.mentor][0]}の見立て</b><p>${mentorText()}</p></div><section class="card"><div class="herohead"><div><span class="badge">${s.title}</span><h1>${esc(s.tree)}</h1><div class="muted">${species[s.sp].n}・樹齢 ${Math.floor(d.age)}日・${d.p[1]}</div></div><button class="money" onclick="openWall()">鑑賞</button></div><div class="stage">${treeSvg()}<div class="season">${seJa[season()]}</div><div class="stats"><div class="stat"><small>水分</small><b>${Math.round(d.w)}</b></div><div class="stat"><small>樹勢</small><b>${Math.round(d.vit)}</b></div><div class="stat"><small>鉢相性</small><b>${Math.round(d.harm)}</b></div></div></div><div class="actions"><button class="act" onclick="care('water')"><span>💧</span><small>水やり</small></button><button class="act" onclick="care('prune')"><span>✂️</span><small>剪定</small></button><button class="act" onclick="care('wire')"><span>〰️</span><small>針金</small></button><button class="act" onclick="care('fert')"><span>🌿</span><small>施肥</small></button></div></section><h2 class="section">作品の状態</h2><div class="grid"><div class="info"><h3>成熟度</h3><div class="big">${Math.round(d.m)}</div><div class="bar"><i style="width:${d.m}%"></i></div></div><div class="info"><h3>枝作り</h3><div class="big">${Math.round(d.branch)}</div><div class="bar"><i style="width:${d.branch}%"></i></div></div><div class="info"><h3>名声</h3><div class="big">${s.rep}</div><div class="muted">60で二樹目、120で三樹目の資格</div></div><div class="info"><h3>今季</h3><div class="big">第${(Math.floor(Date.now()/6048e5)%4)+1}週</div><div class="muted">毎週月曜に大会更新</div></div></div><h2 class="section">鉢合わせ</h2><div class="potgrid">${pots.map(p=>`<div class="item pot ${s.pot===p[0]?'active':''}" style="--pot:${p[4]}"><div class="potshape"></div><h3>${p[1]}</h3><div class="muted">相性 ${p[3]}｜¥${p[2].toLocaleString()}</div><button class="secondary" onclick="pot('${p[0]}')">${s.pot===p[0]?'使用中':s.money>=p[2]?'購入・鉢替え':'資金不足'}</button></div>`).join('')}</div></main>`}function score(){let d=derived(),base=d.vit*.18+d.m*.18+d.branch*.2+d.harm*.17+species[s.sp].se[season()]*.12+Math.min(100,55+s.rep/8)*.15;return Math.max(1,Math.min(100,Math.round(base)))}function rivals(){let wk=Math.floor(Date.now()/6048e5),names=[['橘 蓮','風刻','🧑'],['岩城 岳斗','岳松','👨'],['翠川みのり','紅葉を待つ人','👩'],['風間宗樹','松柏の旅人','🧔'],['花守あかり','季節の編者','👩']];let a=names.map((n,i)=>({name:n[0],tree:n[1],face:n[2],score:67+((wk*13+i*17)%28)}));if(s.lastWeek===wk&&s.awards[0])a.push({name:s.name,tree:s.tree,face:'🧑‍🌾',score:s.awards[0].score,you:true});return a.sort((x,y)=>y.score-x.score)}function showPage(){let wk=Math.floor(Date.now()/6048e5),done=s.lastWeek===wk,sc=score(),r=rivals();return`<main class="wrap page"><h1>週次展覧会</h1><p>同時ログインは不要。今週出展された作品が同じ順位表に並びます。</p><div class="card info"><span class="badge">若葉級・第${wk%4+1}週</span><h3>四季盆栽公募展</h3><div class="grid"><div><div class="muted">出展予想</div><div class="big">${sc}点</div></div><div><div class="muted">鉢相性</div><div class="big">${Math.round(derived().harm)}</div></div></div><button class="primary" onclick="enterShow()" ${done?'disabled':''}>${done?'今週は出展済み':'この作品を出展する'}</button></div><h2 class="section">今週の参加作品</h2><div class="list">${r.map((x,i)=>`<div class="item rankrow ${x.you?'you':''}"><b>${i+1}</b><div><strong>${x.face} ${esc(x.tree)}</strong><small>${esc(x.name)}</small></div><em>${x.score}</em></div>`).join('')}</div><h2 class="section">審査員</h2>${person('judge')}${person('critic')}</main>`}function memorial(){return`<main class="wrap page"><h1>銘木録</h1><p>受賞、剪定、鉢替え。一本の木に積み重なった判断を残します。</p><div class="card"><div class="herohead"><div><span class="badge">${s.title}</span><h1>${esc(s.tree)}</h1><div class="muted">${species[s.sp].n}・育成${Math.floor(derived().age)}日</div></div></div><div class="stage" style="height:280px">${treeSvg()}</div></div><h2 class="section">受賞歴</h2><div class="list">${s.awards.length?s.awards.map(a=>`<div class="item award"><div class="medal">${a.award==='金賞'?'🥇':'🏅'}</div><div><h3>${a.award}</h3><div class="muted">四季盆栽公募展｜${a.score}点｜${new Date(a.at).toLocaleDateString('ja-JP')}</div></div></div>`).join(''):'<div class="empty item">まだ受賞歴はありません。<br>毎週の展覧会へ作品を送り出しましょう。</div>'}</div><h2 class="section">生涯年表</h2><div class="list">${[...s.timeline].reverse().map(t=>`<div class="item timeline"><h3>${esc(t.title)}</h3><div class="muted">${new Date(t.at).toLocaleString('ja-JP')}<br>${esc(t.text)}</div></div>`).join('')}</div></main>`}function peoplePage(){return`<main class="wrap page"><h1>人物録</h1><p>師匠は技術を、ライバルは緊張を、審査員は別の眼を与えます。</p><div class="list">${person(s.mentor)}${person('ren')}${person('gakuto')}${person('judge')}${person('critic')}${person('patron')}</div></main>`}function settings(){return`<main class="wrap page"><h1>設定・保存</h1><p>端末内に自動保存されています。</p><div class="item"><h3>ゲームデータ</h3><button class="secondary" onclick="backup()">バックアップを書き出す</button><label class="secondary" style="display:block;text-align:center;padding:13px">バックアップを復元<input type="file" accept="application/json" onchange="restore(this)" style="display:none"></label><button class="secondary" onclick="notifyReq()">通知を許可する</button><button class="secondary danger" onclick="resetGame()">最初からやり直す</button></div><h2 class="section">iPhoneへの追加</h2><div class="item muted">Safariの共有ボタン →「ホーム画面に追加」→ 名前をBONSAIにして追加してください。最初の一度だけオンラインで起動すると、以後はオフラインでも開けます。</div></main>`}function nav(){return`<nav class="nav"><div class="navin">${[['home','育成','🌳'],['show','大会','🏆'],['mem','銘木録','📖'],['people','人物','🎭'],['settings','設定','⚙️']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[2]}</span>${x[1]}</button>`).join('')}</div></nav>`}function onboarding(){return`<div class="onboard"><div class="mini">育てた時間が、作品になる。</div><h1>BONSAI</h1><div class="tag">最初の一樹を選んでください。</div><div class="choices">${Object.entries(species).map(([k,v])=>`<button class="choice ${s.sp===k?'on':''}" onclick="chooseSp('${k}')"><span>${v.e}</span><div><b>${v.n}</b><small>${v.t}</small></div></button>`).join('')}</div><h2 class="section">師匠を選ぶ</h2><div class="choices">${['gensai','shino'].map(k=>`<button class="choice ${s.mentor===k?'on':''}" onclick="chooseMentor('${k}')"><span>${people[k][2]}</span><div><b>${people[k][0]}</b><small>${people[k][1]}</small></div></button>`).join('')}</div><input id="nm" class="name" value="${species[s.sp].n}・若木" maxlength="14" aria-label="盆栽名"><input id="pn" class="name" value="${s.name}" maxlength="12" aria-label="盆栽師名"><button class="primary" onclick="start()">育成を始める</button></div>`}function modalHtml(){if(modal==='prune')return`<div class="modal"><div class="sheet"><div class="grab"></div><h2>剪定を確定しますか</h2><div class="item" style="border-color:#d77e7277"><b>この操作は取り消せません。</b><p class="muted">一度切った枝は戻りません。樹勢、正面、十年後に残す枝を確認してください。</p></div><button class="primary danger" onclick="confirmPrune()">枝を切る</button><button class="secondary" onclick="closeM()">まだ切らない</button></div></div>`;if(modal==='result'){let a=s.awards[0];return`<div class="modal"><div class="sheet"><div class="grab"></div><div style="text-align:center"><div style="font-size:50px">${a.award==='金賞'?'🥇':'🏅'}</div><h2>${a.award}</h2><div class="big">${a.score}点</div><p class="muted">「鉢との調和と季節感が、作品の落ち着きを支えています。」</p></div><button class="primary" onclick="closeM()">銘木録へ保存して戻る</button></div></div>`;return''}function render(){if(!s.started){$('#root').innerHTML=onboarding();return}let body=tab==='home'?home():tab==='show'?showPage():tab==='mem'?memorial():tab==='people'?peoplePage():settings();$('#root').innerHTML=`<div class="app">${top()}${body}${nav()}</div>${modalHtml()}${wall?`<div class="wall">${treeSvg()}<button onclick="closeWall()">鑑賞を終える</button></div>`:''}${toast?`<div class="toast">${esc(toast)}</div>`:''}`;save()}window.chooseSp=k=>{s.sp=k;render()};window.chooseMentor=k=>{s.mentor=k;render()};window.start=()=>{s.tree=$('#nm').value.trim()||species[s.sp].n;s.name=$('#pn').value.trim()||'あなた';s.started=true;s.born=Date.now();s.last=Date.now();s.timeline=[{at:Date.now(),title:'迎え入れ',text:`小さな${species[s.sp].n}を迎え、${people[s.mentor][0]}に師事した。`}];save();render();note(people[s.mentor][3])};window.go=x=>{tab=x;render();scrollTo(0,0)};window.care=a=>{let d=derived();if(a==='water'){if(d.w>90)return note('土にはまだ十分な水分があります');s.water=96;s.last=Date.now();s.vit=Math.min(100,s.vit+2);s.stats.water++;s.timeline.push({at:Date.now(),title:'水やり',text:'土の乾きを確認し、鉢底まで水を通した。'});note('水が根まで行き渡りました')}if(a==='prune'){if(d.vit<55)return note('樹勢が低く、今は剪定できません');modal='prune';render()}if(a==='wire'){s.wire++;s.stress+=8;s.stats.wire++;s.timeline.push({at:Date.now(),title:'針金かけ',text:'枝の流れを見ながら曲を整えた。'});note('枝に新しい流れを与えました')}if(a==='fert'){s.fert=Math.min(5,s.fert+1);s.money=Math.max(0,s.money-120);s.timeline.push({at:Date.now(),title:'施肥',text:'樹勢を見ながら少量の肥料を与えた。'});note('肥料を与えました')}save();render()};window.confirmPrune=()=>{s.prune++;s.stats.prune++;s.stress+=13;s.timeline.push({at:Date.now(),title:'不可逆の剪定',text:'将来の樹姿を選び、一本の枝を切った。切った枝は戻らない。'});modal='';save();render();note('剪定を記録しました')};window.closeM=()=>{modal='';render()};window.pot=id=>{let p=pots.find(x=>x[0]===id);if(s.pot===id)return note('現在使用中の鉢です');if(s.money<p[2])return note('資金が不足しています');s.money-=p[2];s.pot=id;s.timeline.push({at:Date.now(),title:'鉢替え',text:`${p[1]}へ植え替えた。`});save();render();note(`${p[1]}へ鉢替えしました`)};window.enterShow=()=>{let wk=Math.floor(Date.now()/6048e5);if(s.lastWeek===wk)return note('今週は出展済みです');let sc=score(),field=rivals();let rank=field.filter(x=>x.score>sc).length+1,award=rank===1&&sc>=84?'金賞':rank<=3?'優秀賞':sc>=70?'入選':'選外',prize=award==='金賞'?5000:award==='優秀賞'?2500:award==='入選'?900:0;s.lastWeek=wk;s.stats.shows++;s.rep+=award==='金賞'?35:award==='優秀賞'?22:award==='入選'?10:3;s.money+=prize;s.awards.unshift({at:Date.now(),score:sc,rank,award});s.timeline.push({at:Date.now(),title:`${award}・四季盆栽公募展`,text:`${sc}点、第${rank}位。鉢相性${Math.round(derived().harm)}で出展した。`});modal='result';save();render()};window.openWall=()=>{wall=true;render()};window.closeWall=()=>{wall=false;render()};window.backup=()=>{let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`BONSAI_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);note('バックアップを作成しました')};window.restore=el=>{let f=el.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.started)throw 0;s={...fresh(),...v};save();tab='home';render();note('バックアップを復元しました')}catch{note('バックアップを読み込めません')}};r.readAsText(f)};window.notifyReq=async()=>{if(!('Notification'in window))return note('この端末では通知を利用できません');let p=await Notification.requestPermission();note(p==='granted'?'通知を許可しました':'通知は許可されませんでした')};window.resetGame=()=>{if(confirm('すべての育成記録を削除しますか？')){localStorage.removeItem(K);s=fresh();tab='home';render()}};render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
